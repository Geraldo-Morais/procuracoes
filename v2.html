<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia da procuração | Menezes Advocacia</title>
<link rel="icon" href="logo.png">
<style>
/* =====================================================================
   PROTÓTIPO — guia de abertura ("mapa mental") do gerador de procurações.
   Faz 3 ou 4 perguntas em linguagem de balcão e DEDUZ o que hoje o
   parceiro tem que escolher no jargão: tipo da procuração, qualidade do
   representante, benefício e assinatura a rogo.
   Nada de barra lateral: a decisão acontece no centro da tela e, no fim,
   vira uma trilha de uma linha que dá pra clicar e mudar.
   Paleta e tipografia herdadas do gerador (index.html).
   ===================================================================== */
:root {
    --vinho: #622423;
    --vinho-claro: #703030;
    --vinho-escuro: #46181a;
    --papel: #ece7e4;
    --linha: #d6cdc9;
    --texto: #2f2422;
    --suave: #8a6e6c;
    --verde: #46c07a;
    --ambar: #f0b429;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0; background: var(--papel); color: var(--texto);
    font-family: Arial, Helvetica, sans-serif;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
}

/* ---------- topo ---------- */
.topo {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 10px 20px; color: #f4e9e7;
    background: linear-gradient(180deg, var(--vinho-claro) 0%, #55211e 100%);
    box-shadow: 0 2px 12px rgba(45,18,16,0.28);
}
.topo img { height: 30px; width: auto; opacity: 0.92; }
.topo b { font-size: 11pt; letter-spacing: 0.3pt; }
.topo small { display: block; font-size: 7.5pt; opacity: 0.7; letter-spacing: 0.6pt; text-transform: uppercase; }
.topo .pular {
    margin-left: auto; background: rgba(255,255,255,0.09); color: #f4e9e7;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 7px;
    padding: 7px 13px; font-size: 8.5pt; font-weight: bold; cursor: pointer;
    font-family: inherit; transition: background .16s ease, transform .16s ease;
}
.topo .pular:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }

/* ---------- palco ---------- */
/* O palco rola sozinho e o conteudo nunca encosta na borda: em 100% de zoom
   a coluna da direita (consequencias) somada as opcoes estourava a altura. */
.palco { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 22px 20px 36px; }
.centro { max-width: 1020px; margin: 0 auto; }

/* ---------- trilha de passos ---------- */
.trilha { display: flex; align-items: center; gap: 0; margin: 0 auto 20px; max-width: 520px; }
.trilha[hidden] { display: none; }
.trilha .no {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8.5pt; font-weight: bold;
    background: #fff; color: var(--suave); border: 1.5px solid var(--linha);
    transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s ease;
}
.trilha .no.feito { background: var(--vinho); color: #fff; border-color: var(--vinho); }
.trilha .no.agora { background: #fff; color: var(--vinho); border-color: var(--vinho); transform: scale(1.14); box-shadow: 0 0 0 4px rgba(98,36,35,0.12); }
.trilha .fio { flex: 1 1 auto; height: 2px; background: var(--linha); position: relative; }
.trilha .fio i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--vinho); transition: width .35s ease; }
.trilha .fio.feito i { width: 100%; }

/* ---------- cartão da pergunta ---------- */
.cena { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 22px; align-items: start; }
@media (max-width: 900px) { .cena { grid-template-columns: minmax(0,1fr); } }

.pergunta {
    background: #fff; border: 1px solid var(--linha); border-radius: 12px;
    padding: 22px 24px 18px; box-shadow: 0 6px 24px rgba(62,35,31,0.09);
    animation: entra .28s ease both;
}
@keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.pergunta .passo { font-size: 8pt; font-weight: bold; letter-spacing: 0.8pt; text-transform: uppercase; color: var(--suave); }
.pergunta h1 {
    font-family: 'Times New Roman', Times, serif;
    font-size: 19pt; line-height: 1.2; margin: 5px 0 3px; color: var(--vinho);
}
.pergunta .ajuda { font-size: 9pt; color: var(--suave); line-height: 1.45; margin: 0 0 14px; }

.opcoes { display: grid; gap: 8px; }
.opcoes.duas { grid-template-columns: 1fr 1fr; }
@media (max-width: 640px) { .opcoes.duas { grid-template-columns: 1fr; } }
.opcao {
    display: flex; align-items: flex-start; gap: 11px; text-align: left;
    background: #fdfbfa; border: 1.5px solid var(--linha); border-radius: 10px;
    padding: 11px 13px; cursor: pointer; font-family: inherit; color: inherit;
    transition: border-color .16s ease, background .16s ease, transform .16s ease, box-shadow .16s ease;
}
.opcao:hover { border-color: var(--vinho); background: #fff; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(62,35,31,0.12); }
.opcao:focus-visible { outline: 3px solid rgba(98,36,35,0.35); outline-offset: 2px; }
.opcao.marcada { border-color: var(--vinho); background: #fff; box-shadow: 0 0 0 3px rgba(98,36,35,0.12); }
.opcao .tecla {
    flex: 0 0 auto; width: 21px; height: 21px; border-radius: 5px; margin-top: 1px;
    background: var(--papel); color: var(--suave); border: 1px solid var(--linha);
    display: flex; align-items: center; justify-content: center; font-size: 8pt; font-weight: bold;
}
.opcao.marcada .tecla, .opcao:hover .tecla { background: var(--vinho); color: #fff; border-color: var(--vinho); }
.opcao .rot { min-width: 0; }
.opcao b { display: block; font-size: 10pt; line-height: 1.28; }
.opcao .desc { display: block; font-size: 8.8pt; color: var(--suave); line-height: 1.45; margin-top: 3px; }

.rodape-cena { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
.btn-voltar {
    background: none; border: none; color: var(--suave); font-family: inherit;
    font-size: 9pt; font-weight: bold; cursor: pointer; padding: 6px 2px;
}
.btn-voltar:hover { color: var(--vinho); }
.btn-voltar[hidden] { display: none; }
.dica-teclado { margin-left: auto; font-size: 8pt; color: var(--suave); }
.dica-teclado kbd {
    background: #fff; border: 1px solid var(--linha); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; font-family: inherit; font-size: 7.5pt;
}

/* ---------- painel de consequências ---------- */
.consequencia {
    background: #fff; border: 1px solid var(--linha); border-radius: 12px;
    padding: 16px 16px 13px; box-shadow: 0 6px 24px rgba(62,35,31,0.07);
    position: sticky; top: 0; max-height: calc(100vh - 150px); overflow-y: auto;
}
.consequencia h2 {
    font-size: 8pt; letter-spacing: 0.8pt; text-transform: uppercase;
    color: var(--suave); margin: 0 0 12px;
}
.deriv { margin: 0 0 14px; }
.deriv dt { font-size: 7.5pt; text-transform: uppercase; letter-spacing: 0.5pt; color: var(--suave); }
.deriv dd { margin: 1px 0 9px; font-size: 10pt; font-weight: bold; color: var(--vinho); }
.deriv dd.vazio { color: #bfb2ae; font-weight: normal; font-style: italic; }

.regras { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 7px; }
.regras li {
    font-size: 8.6pt; line-height: 1.45; color: var(--texto);
    background: #f7f3f1; border-left: 3px solid var(--ambar);
    padding: 7px 10px; border-radius: 0 6px 6px 0;
    animation: entra .25s ease both;
}
.regras li.ok { border-left-color: var(--verde); }

.folhas { display: flex; gap: 7px; flex-wrap: wrap; }
.folha {
    width: 46px; height: 62px; background: #fff; border: 1px solid var(--linha);
    border-radius: 3px; box-shadow: 0 2px 6px rgba(62,35,31,0.1);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 5px 3px 0; gap: 4px; position: relative; overflow: hidden;
    animation: entra .25s ease both;
}
.folha::before { content: ""; width: 26px; height: 2px; background: var(--vinho); border-radius: 1px; }
.folha i {
    width: 30px; height: 1.5px; background: var(--linha); border-radius: 1px;
    box-shadow: 0 4px 0 var(--linha), 0 8px 0 var(--linha), 0 12px 0 var(--linha);
}
.folha em { position: absolute; bottom: 3px; font-style: normal; font-size: 5.5pt; color: var(--suave); letter-spacing: 0.2pt; }

/* ---------- resultado ---------- */
.resultado { animation: entra .3s ease both; }
.resultado[hidden] { display: none; }
.resultado .capa {
    background: #fff; border: 1px solid var(--linha); border-radius: 12px;
    padding: 28px; box-shadow: 0 6px 24px rgba(62,35,31,0.09);
}
.resultado h1 {
    font-family: 'Times New Roman', Times, serif; color: var(--vinho);
    font-size: 22pt; margin: 0 0 4px;
}
.resultado .sub { font-size: 9.5pt; color: var(--suave); margin: 0 0 22px; }
.grade-res { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
.card-res { background: #fdfbfa; border: 1px solid var(--linha); border-radius: 9px; padding: 12px 14px; }
.card-res dt { font-size: 7.5pt; text-transform: uppercase; letter-spacing: 0.5pt; color: var(--suave); }
.card-res dd { margin: 3px 0 0; font-size: 11pt; font-weight: bold; color: var(--vinho); line-height: 1.25; }
.acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn-principal {
    background: linear-gradient(180deg, var(--vinho-claro), var(--vinho-escuro));
    color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px;
    padding: 12px 22px; font-size: 10pt; font-weight: bold; cursor: pointer;
    font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 14px rgba(25,5,5,0.22);
    transition: transform .14s ease, box-shadow .14s ease;
}
.btn-principal:hover { transform: translateY(-1px); box-shadow: 0 7px 20px rgba(25,5,5,0.3); }
.btn-secundario {
    background: #fff; color: var(--vinho); border: 1px solid var(--linha);
    border-radius: 8px; padding: 12px 18px; font-size: 9.5pt; font-weight: bold;
    cursor: pointer; font-family: inherit;
}
.btn-secundario:hover { border-color: var(--vinho); }

/* ---------- trilha compacta (depois de responder) ---------- */
.trilha-compacta {
    display: none; align-items: center; gap: 8px; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--linha); border-radius: 10px;
    padding: 9px 13px; margin-bottom: 18px; font-size: 8.8pt;
    box-shadow: 0 3px 12px rgba(62,35,31,0.07);
}
.trilha-compacta.mostrar { display: flex; }
.trilha-compacta .rotulo { font-size: 7.5pt; text-transform: uppercase; letter-spacing: 0.5pt; color: var(--suave); }
.trilha-compacta .marca {
    background: var(--papel); border: 1px solid var(--linha); border-radius: 20px;
    padding: 4px 11px; cursor: pointer; font-family: inherit; font-size: 8.5pt; color: var(--texto);
    transition: border-color .14s ease, background .14s ease;
}
.trilha-compacta .marca:hover { border-color: var(--vinho); background: #fff; }
.trilha-compacta .marca b { color: var(--vinho); }
.trilha-compacta .sep { color: var(--linha); }
.nota-prototipo {
    max-width: 1020px; margin: 22px auto 0; font-size: 8pt; color: var(--suave);
    text-align: center; line-height: 1.6;
}
</style>
</head>
<body>

<header class="topo">
    <img src="logo.png" alt="">
    <div>
        <b>Guia da procuração</b>
        <small>Menezes Advocacia</small>
    </div>
    <button type="button" class="pular" id="btnPular">Já sei o que preciso — pular &rarr;</button>
</header>

<main class="palco">
<div class="centro">

    <div class="trilha-compacta" id="trilhaCompacta"></div>
    <div class="trilha" id="trilha"></div>

    <div class="cena" id="cena">
        <section class="pergunta" id="pergunta" aria-live="polite"></section>
        <aside class="consequencia" id="consequencia">
            <h2>O que já dá pra saber</h2>
            <dl class="deriv" id="deriv"></dl>
            <ul class="regras" id="regras"></ul>
            <h2 style="margin-top:16px">Documentos que vão sair</h2>
            <div class="folhas" id="folhas"></div>
        </aside>
    </div>

    <div class="resultado" id="resultado" hidden></div>

    <p class="nota-prototipo">
        Protótipo do guia de abertura. Ele só <b>decide</b> — o preenchimento dos
        dados continua sendo feito direto no documento, no gerador.
    </p>
</div>
</main>

<script>
/* =====================================================================
   O guia pergunta o que o parceiro sabe (idade, quem responde pela pessoa,
   qual benefício, se sabe assinar) e DEDUZ o que o gerador precisa:
   tipo da procuração, qualidade do representante e assinatura a rogo.
   Cada resposta mostra na hora a consequência — é isso que dá a sensação
   de mapa: você vê o galho que escolheu e o que ele muda.
   ===================================================================== */

var BENEFICIOS = [
    'Benefício de Prestação Continuada (BPC/LOAS)',
    'Aposentadoria por Idade Rural',
    'Aposentadoria por Idade Urbana',
    'Aposentadoria por Idade Híbrida',
    'Benefício por Incapacidade',
    'Auxílio-Acidente',
    'Auxílio-Reclusão',
    'Salário-Maternidade Rural',
    'Salário-Maternidade Urbano',
    'Pensão por Morte Rural',
    'Pensão por Morte Urbana',
    'Revisão de Benefício',
    'Outro'
];

var PERGUNTAS = [
    {
        id: 'quem',
        titulo: 'Quem vai receber o benefício?',
        ajuda: 'É esta resposta que define o tipo da procuração. Escolha pela situação real da pessoa — o nome técnico o guia coloca sozinho.',
        opcoes: [
            { v: 'adulto',    t: 'Um adulto que resolve as próprias coisas', d: 'Maior de 18 anos, sem curatela e sem representante definido.' },
            { v: 'crianca',   t: 'Uma criança de até 15 anos',               d: 'Quem responde é o representante legal, em nome dela.' },
            { v: 'adolesc',   t: 'Um adolescente de 16 ou 17 anos',          d: 'Ela participa do ato, assistida por um responsável.' },
            { v: 'assistida', t: 'Um adulto que precisa de outra pessoa para resolver as coisas', d: 'Não resolve sozinho: pessoa com deficiência, idoso, ou quem já tem alguém respondendo por ele.' }
        ]
    },
    {
        id: 'quemresponde',
        titulo: 'Quem responde por essa pessoa?',
        ajuda: 'O parentesco, ou o documento que essa pessoa tem, é o que define a qualidade no documento — e muda o texto do Termo de Compromisso.',
        pularSe: function (r) { return r.quem === 'adulto'; },
        opcoes: [
            { v: 'TutorNato',  t: 'O pai ou a mãe',                    d: 'Tutor nato — não precisa de documento judicial.' },
            { v: 'Curador',    t: 'Curador, com sentença de curatela', d: 'Existe processo de curatela concluído.' },
            { v: 'TutorLegal', t: 'Tutor nomeado pelo juiz',           d: 'Há termo de tutela.' },
            { v: 'Guarda',     t: 'Guardião, com termo de guarda',     d: 'Guarda deferida judicialmente.' },
            { v: 'AdmProv',    t: 'Administrador provisório',          d: 'Cadastrado no INSS enquanto a curatela não sai. É a opção para quem ainda não tem documento de representação.' }
        ]
    },
    {
        id: 'beneficio',
        titulo: 'Qual benefício vai ser pedido?',
        ajuda: 'É o que entra no Termo de Benefício, e é obrigatório. Em alguns casos também define a profissão.',
        opcoes: BENEFICIOS.map(function (b) { return { v: b, t: b, d: '' }; })
    },
    {
        id: 'assina',
        titulo: 'Quem vai assinar sabe assinar?',
        ajuda: 'Vale para quem assina de fato — o próprio titular, o representante ou o assistente, conforme o caso.',
        opcoes: [
            { v: 'sim', t: 'Sim, assina normalmente',            d: 'Linha de assinatura comum nos documentos.' },
            { v: 'nao', t: 'Não sabe assinar, ou não consegue',   d: 'Entra assinatura a rogo, duas testemunhas e impressão digital.' }
        ]
    }
];

var respostas = {};
var passo = 0;

function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

/* ---------- deduções ---------- */
function tipoDeduzido() {
    if (!respostas.quem) return null;
    if (respostas.quem === 'crianca') return { id: 'incapaz', nome: 'Absolutamente Incapaz' };
    if (respostas.quem === 'adolesc' || respostas.quem === 'assistida') return { id: 'relativo', nome: 'Relativamente Incapaz' };
    return { id: 'normal', nome: 'Normal' };
}
var QUALIDADE_NOME = {
    TutorNato: 'Tutor nato (pai ou mãe)', Curador: 'Curador', TutorLegal: 'Tutor legal',
    Guarda: 'Responsável por termo de guarda', AdmProv: 'Administrador provisório'
};
function papelDoSignatario() {
    var t = tipoDeduzido();
    if (!t) return null;
    if (t.id === 'incapaz') return 'Representante legal';
    if (t.id === 'relativo') return 'Assistente legal';
    return 'O próprio outorgante';
}
function documentos() {
    var t = tipoDeduzido();
    if (!t) return [];
    var d = [{ n: 'Procuração', c: 'Proc.' }, { n: 'Termo de Benefício', c: 'Benef.' }];
    if (t.id !== 'normal') {
        d.push({ n: 'Termo de Responsabilidade', c: 'Resp.' });
        d.push({ n: 'Termo de Compromisso', c: 'Comp.' });
    }
    return d;
}
function regrasAtivas() {
    var r = [];
    var t = tipoDeduzido();
    if (t) r.push({ ok: true, txt: 'Procuração do tipo <b>' + t.nome + '</b>. Quem assina: <b>' + papelDoSignatario().toLowerCase() + '</b>.' });
    if (respostas.quemresponde === 'TutorNato') {
        r.push({ ok: true, txt: 'Como é <b>pai ou mãe</b>, o Termo de Compromisso <b>não pede</b> o prazo de 6 meses para comprovar a representação.' });
    } else if (respostas.quemresponde) {
        r.push({ txt: 'O Termo de Compromisso vai pedir a comprovação da representação em <b>até 6 meses</b>.' });
    }
    if (respostas.beneficio) {
        if (/rural/i.test(respostas.beneficio)) r.push({ ok: true, txt: 'Benefício rural: a profissão entra como <b>LAVRADOR(A)</b>.' });
        else if (/BPC|LOAS/i.test(respostas.beneficio)) r.push({ ok: true, txt: 'BPC: a profissão entra como <b>DESEMPREGADO(A)</b>.' });
    }
    if (respostas.assina === 'nao') {
        r.push({ txt: 'Todos os documentos ganham <b>assinatura a rogo</b>, <b>duas testemunhas</b> e <b>impressão digital</b>. Os CPFs precisam ser diferentes entre si.' });
    }
    return r;
}

/* ---------- render ---------- */
function visiveis() {
    return PERGUNTAS.filter(function (p) { return !(p.pularSe && p.pularSe(respostas)); });
}
function renderTrilha() {
    var lista = visiveis(), el = document.getElementById('trilha'), h = '';
    lista.forEach(function (p, i) {
        h += '<span class="no ' + (i < passo ? 'feito' : (i === passo ? 'agora' : '')) + '">' + (i + 1) + '</span>';
        if (i < lista.length - 1) h += '<span class="fio ' + (i < passo ? 'feito' : '') + '"><i></i></span>';
    });
    el.innerHTML = h;
    el.hidden = false;
}
function renderPergunta() {
    var lista = visiveis();
    if (passo >= lista.length) return renderResultado();
    var p = lista[passo];
    var duas = (p.id === 'beneficio' || p.opcoes.length > 4) ? ' duas' : '';
    var h = '<div class="passo">Passo ' + (passo + 1) + ' de ' + lista.length + '</div>' +
            '<h1>' + p.titulo + '</h1><p class="ajuda">' + p.ajuda + '</p>' +
            '<div class="opcoes' + duas + '" role="group">';
    p.opcoes.forEach(function (o, i) {
        h += '<button type="button" class="opcao' + (respostas[p.id] === o.v ? ' marcada' : '') + '" data-v="' + esc(o.v) + '">' +
             '<span class="tecla">' + (i < 9 ? (i + 1) : '·') + '</span>' +
             '<span class="rot"><b>' + esc(o.t) + '</b>' + (o.d ? '<span class="desc">' + esc(o.d) + '</span>' : '') + '</span></button>';
    });
    h += '</div><div class="rodape-cena">' +
         '<button type="button" class="btn-voltar" id="btnVoltar"' + (passo === 0 ? ' hidden' : '') + '>&larr; voltar</button>' +
         '<span class="dica-teclado">use <kbd>1</kbd>&hellip;<kbd>9</kbd> ou clique</span></div>';
    var el = document.getElementById('pergunta');
    el.innerHTML = h;
    el.querySelectorAll('.opcao').forEach(function (b) {
        b.addEventListener('click', function () { responder(p.id, b.getAttribute('data-v')); });
    });
    var v = document.getElementById('btnVoltar');
    if (v) v.addEventListener('click', voltar);
    var primeiro = el.querySelector('.opcao');
    if (primeiro) primeiro.focus();
}
function renderConsequencia() {
    var t = tipoDeduzido();
    var q = respostas.quemresponde;
    var semQualidade = (t && t.id === 'normal') ? '—' : 'a definir';
    document.getElementById('deriv').innerHTML =
        '<dt>Tipo da procuração</dt><dd class="' + (t ? '' : 'vazio') + '">' + (t ? t.nome : 'a definir') + '</dd>' +
        '<dt>Qualidade de quem assina</dt><dd class="' + (q ? '' : 'vazio') + '">' + (q ? QUALIDADE_NOME[q] : semQualidade) + '</dd>' +
        '<dt>Benefício</dt><dd class="' + (respostas.beneficio ? '' : 'vazio') + '">' + esc(respostas.beneficio || 'a definir') + '</dd>';
    document.getElementById('regras').innerHTML = regrasAtivas().map(function (r) {
        return '<li' + (r.ok ? ' class="ok"' : '') + '>' + r.txt + '</li>';
    }).join('');
    var docs = documentos();
    document.getElementById('folhas').innerHTML = docs.length
        ? docs.map(function (d) { return '<div class="folha" title="' + esc(d.n) + '"><i></i><em>' + d.c + '</em></div>'; }).join('')
        : '<span style="font-size:8.5pt;color:#8a6e6c">responda o passo 1</span>';
}
function renderTrilhaCompacta() {
    var el = document.getElementById('trilhaCompacta');
    var lista = visiveis();
    var partes = [];
    lista.forEach(function (p, i) {
        var v = respostas[p.id];
        if (!v) return;
        var rot = p.id === 'quemresponde' ? QUALIDADE_NOME[v]
                : p.id === 'assina' ? (v === 'nao' ? 'Não assina' : 'Assina')
                : p.id === 'quem' ? tipoDeduzido().nome
                : v;
        partes.push('<button type="button" class="marca" data-passo="' + i + '"><b>' + esc(rot) + '</b></button>');
    });
    el.innerHTML = partes.length ? '<span class="rotulo">Escolhas</span>' + partes.join('<span class="sep">›</span>') : '';
    el.classList.toggle('mostrar', partes.length > 0);
    el.querySelectorAll('.marca').forEach(function (b) {
        b.addEventListener('click', function () {
            passo = parseInt(b.getAttribute('data-passo'), 10);
            document.getElementById('resultado').hidden = true;
            document.getElementById('cena').style.display = '';
            render();
        });
    });
}
function renderResultado() {
    var t = tipoDeduzido();
    document.getElementById('cena').style.display = 'none';
    document.getElementById('trilha').hidden = true;
    var docs = documentos();
    var el = document.getElementById('resultado');
    el.hidden = false;
    el.innerHTML =
        '<div class="capa"><h1>Pronto &mdash; é isto que vai ser gerado</h1>' +
        '<p class="sub">' + docs.length + ' documentos, cada um em uma folha A4. Agora é só preencher os dados direto neles.</p>' +
        '<div class="grade-res">' +
        '<div class="card-res"><dt>Tipo</dt><dd>' + t.nome + '</dd></div>' +
        '<div class="card-res"><dt>Quem assina</dt><dd>' + papelDoSignatario() + '</dd></div>' +
        (respostas.quemresponde ? '<div class="card-res"><dt>Qualidade</dt><dd>' + QUALIDADE_NOME[respostas.quemresponde] + '</dd></div>' : '') +
        '<div class="card-res"><dt>Benefício</dt><dd>' + esc(respostas.beneficio) + '</dd></div>' +
        '<div class="card-res"><dt>Assinatura</dt><dd>' + (respostas.assina === 'nao' ? 'A rogo + 2 testemunhas' : 'Assinatura própria') + '</dd></div>' +
        '</div>' +
        '<ul class="regras" style="margin-bottom:22px">' +
        regrasAtivas().map(function (r) { return '<li' + (r.ok ? ' class="ok"' : '') + '>' + r.txt + '</li>'; }).join('') +
        '</ul><div class="acoes">' +
        '<a class="btn-principal" href="index.html">Abrir o gerador &rarr;</a>' +
        '<button type="button" class="btn-secundario" id="btnRefazer">Refazer o guia</button>' +
        '</div></div>';
    document.getElementById('btnRefazer').addEventListener('click', function () {
        respostas = {}; passo = 0;
        el.hidden = true;
        document.getElementById('cena').style.display = '';
        render();
    });
    renderTrilhaCompacta();
}
function render() {
    renderTrilha();
    renderPergunta();
    renderConsequencia();
    renderTrilhaCompacta();
}
function responder(id, v) {
    respostas[id] = v;
    // trocar a resposta do passo 1 pode tornar a pergunta 2 inaplicável
    if (id === 'quem' && v === 'adulto') delete respostas.quemresponde;
    passo++;
    render();
}
function voltar() { if (passo > 0) { passo--; render(); } }

document.addEventListener('keydown', function (e) {
    if (!document.getElementById('resultado').hidden) return;
    if (e.key === 'Backspace' || e.key === 'ArrowLeft') { e.preventDefault(); voltar(); return; }
    if (/^[1-9]$/.test(e.key)) {
        var b = document.querySelectorAll('#pergunta .opcao')[parseInt(e.key, 10) - 1];
        if (b) { e.preventDefault(); b.click(); }
    }
});
document.getElementById('btnPular').addEventListener('click', function () { location.href = 'index.html'; });

render();
</script>
</body>
</html>
